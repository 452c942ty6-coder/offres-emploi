<title>RATIPORTAIL</title>
<style>
:root{--ink:#2b1d16;--cream:#fff2dc;--cream2:#f1dfc0;--brown:#7b6252;--amber:#e9a23b;--ember:#e0663a}
*{box-sizing:border-box}
body{margin:0;color:#f6ead4;font:17px/1.5 "Fredoka","Baloo 2",ui-rounded,"Trebuchet MS",sans-serif;
 background:linear-gradient(180deg,#171b3a 0%,#2a2652 60%,#3a2f5a 100%) fixed;min-height:100vh}
main{max-width:720px;margin:auto;padding:20px 16px 56px}
.hero{display:block;width:100%;max-width:460px;height:auto;margin:0 auto 6px}
h1{font-size:1.7rem;margin:6px 0 0;text-align:center;font-weight:600;color:var(--cream);text-shadow:3px 3px 0 var(--ink)}
.tag1{text-align:center;color:#c9c3ea;margin:0 0 2px}
.mut{text-align:center;color:#a9a3cf;font-size:.85rem;min-height:1.2em}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
input,select{padding:10px 14px;border:3px solid var(--ink);border-radius:16px;background:var(--cream);color:var(--ink);font:inherit;font-size:.95rem;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
input{flex:1 1 220px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.card{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-left:12px solid var(--cream2);border-radius:18px;padding:12px 14px;margin:14px 0;box-shadow:4px 4px 0 rgba(0,0,0,.4)}
.card.isnew{border-left-color:var(--ember)}
.card.isfav{border-left-color:var(--amber)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h2{font-size:1.05rem;margin:0;line-height:1.3;font-weight:600}
.card h2 a{color:var(--ink);text-decoration:none}
.card h2 a:hover{text-decoration:underline wavy var(--ember)}
.fav{background:none;border:0;font-size:1.5rem;line-height:1;cursor:pointer;color:#c4801a;padding:2px 4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:.85rem;color:var(--brown)}
.new{background:var(--ember);color:var(--cream);border-radius:99px;padding:0 10px;font-weight:600}
.row select{padding:3px 10px;font-size:.85rem;border-width:2px;border-radius:12px;box-shadow:none;background:#fff}
.note{border:3px dashed #5b5590;border-radius:16px;padding:8px 14px;margin:12px 0;font-size:.9rem;color:#d9d3f0}
.empty{text-align:center;color:#c9c3ea;padding:32px 0}
.fl{animation:fall linear infinite}
.steam{animation:steam 3s ease-in-out infinite}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(150px)}}
@keyframes steam{0%,100%{opacity:.2;transform:translateY(2px)}50%{opacity:.8;transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.fl,.steam{animation:none}}
</style></head><body><main>

<h1>Offres sociales au Luxembourg</h1>
<p class="tag1">Le raton veille sur les offres pendant que tu te réchauffes</p>
<div class="mut" id="meta"></div>
<div class="bar">
 <input id="q" type="search" placeholder="Rechercher un poste, un employeur, une ville" aria-label="Rechercher">
 <select id="src" aria-label="Source"></select>
 <select id="view" aria-label="Affichage">
  <option value="">Toutes les offres</option><option value="new">Nouvelles</option><option value="fav">Favoris</option>
 </select>
</div>
<div id="note"></div>
<div id="list"></div>
</main>
<script>
const SAMPLE=[
 {id:"x1",title:"Éducateur/trice spécialisé(e) – foyer de jour (exemple)",employer:"Employeur exemple A",source:"Exemple",location:"Luxembourg-Ville",url:"#",first_seen:new Date().toISOString()},
 {id:"x2",title:"Éducateur/trice gradué(e) – accompagnement de jeunes (exemple)",employer:"Employeur exemple B",source:"Exemple",location:"Esch-sur-Alzette",url:"#",first_seen:"2026-10-01T00:00:00Z"},
 {id:"x3",title:"Assistant(e) social(e) – service famille (exemple)",employer:"Employeur exemple C",source:"Exemple",location:"Differdange",url:"#",first_seen:"2026-09-12T00:00:00Z"}
];
const KEY="portail-emploi-v1";
let S={};try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
S.fav=S.fav||{};S.st=S.st||{};
const last=S.last||0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STAT=["","À voir","Postulé","Entretien","Refusé"];
let D={jobs:[]};
fetch("jobs.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()})
 .catch(()=>({sample:true,jobs:SAMPLE})).then(d=>{D=d;init()});
function init(){
 const srcs=[...new Set(D.jobs.map(j=>j.source))].sort();
 src.innerHTML='<option value="">Toutes les sources</option>'+srcs.map(s=>`<option>${esc(s)}</option>`).join("");
 meta.textContent=D.updated?"Mis à jour le "+new Date(D.updated).toLocaleString("fr-FR",{dateStyle:"long",timeStyle:"short"}):"";
 note.innerHTML=D.sample?'<div class="note">Données d’exemple. Les vraies offres apparaîtront quand le fichier jobs.json sera généré par le collecteur.</div>':"";
 render();
 S.last=Date.now();save();
}
function render(){
 const t=q.value.toLowerCase(),s=src.value,v=view.value;
 const rows=D.jobs.filter(j=>{
  const isNew=Date.parse(j.first_seen)>last;
  return (!s||j.source===s)&&(v!=="new"||isNew)&&(v!=="fav"||S.fav[j.id])
   &&(!t||(j.title+" "+j.employer+" "+(j.location||"")).toLowerCase().includes(t));
 }).sort((a,b)=>Date.parse(b.first_seen)-Date.parse(a.first_seen));
 list.innerHTML=rows.length?rows.map(j=>{
  const isNew=Date.parse(j.first_seen)>last,f=S.fav[j.id],st=S.st[j.id]||"";
  return `<article class="card ${isNew?"isnew":""} ${f?"isfav":""}">
  <div class="top"><h2><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></h2>
  <button class="fav" data-f="${esc(j.id)}" aria-label="Favori" aria-pressed="${!!f}">${f?"★":"☆"}</button></div>
  <div class="row"><span>${esc(j.employer)}</span><span>${esc(j.location||"")}</span><span>${esc(j.source)}</span>
  <span>vue le ${new Date(j.first_seen).toLocaleDateString("fr-FR")}</span>${isNew?'<span class="new">Nouvelle</span>':""}
  <select data-s="${esc(j.id)}" aria-label="Statut">${STAT.map(x=>`<option value="${x}"${x===st?" selected":""}>${x||"Statut"}</option>`).join("")}</select></div>
  </article>`}).join(""):'<div class="empty">Aucune offre pour ces filtres.</div>';
}
[q,src,view].forEach(e=>e.addEventListener("input",render));
list.addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(!b)return;
 const id=b.dataset.f;S.fav[id]?delete S.fav[id]:S.fav[id]=1;save();render()});
list.addEventListener("change",e=>{const s=e.target.dataset.s;if(s){S.st[s]=e.target.value;save()}});
</script></body></html>
